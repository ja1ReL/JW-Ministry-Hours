<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Tells the browser that this document uses HTML5. -->
    <meta charset="UTF-8">

    <!-- Makes the page scale properly on phones and other screen sizes. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Connects this HTML file to our CSS file. -->
    <link rel="stylesheet" href="style.css">

    <!-- Sets the text shown in the browser tab. -->
    <title>JW Ministry Hours</title>
</head>

<body>

    <!-- Contains the main content of our application. -->
    <main>

        <!-- Contains the title of our application. -->
        <header>

            <!-- Displays the main heading. -->
            <h1>JW Ministry Hours</h1>

        </header>

        <div class="month-navigation"> <!-- Groups the month controls together. -->

    <button id="previousMonthButton">&lt;</button> <!-- Goes to the previous month. -->

    <h2 id="monthTitle"></h2> <!-- Displays the current month. -->

    <button id="nextMonthButton">&gt;</button> <!-- Goes to the next month. -->

            </div>


        <div class="total-hours"> <!-- Contains the monthly total. -->

    <span>Total hours</span> <!-- Displays the label. -->

    <strong id="totalHours">0</strong> <!-- Displays the actual number of hours. -->

</div>


        <section class="hours-form"> <!-- Contains the Add Ministry Hours form. -->

    <h2>Add Ministry Hours</h2> <!-- Displays the form heading. -->

    <div class="form-field"> <!-- Groups the Date label and input together. -->
        <label for="dateInput">Date</label> <!-- Describes the date input. -->
        <input type="date" id="dateInput"> <!-- Allows the user to select a date. -->
    </div>

    <div class="form-field"> <!-- Groups the Hours label and input together. -->
        <label for="hoursInput">Hours</label> <!-- Describes the hours input. -->
        <input type="number" id="hoursInput"> <!-- Allows the user to enter hours. -->
    </div>

    <div class="form-field"> <!-- Groups the Description label and input together. -->
        <label for="descriptionInput">Description</label> <!-- Describes the description input. -->
        <textarea id="descriptionInput" rows="1"></textarea> <!-- Allows longer descriptions and can grow vertically. -->
    </div>

    <button id="addHoursButton">Add Hours</button> <!-- Adds the new entry. -->

</section>


        <!-- Contains the table displaying our volunteer entries. -->
        <table>

            <!-- Contains the headings for each column. -->
            <thead>

                <!-- Creates a row for the table headings. -->
                <tr>

                    <!-- Heading for the date column. -->
                    <th>Date</th>

                    <!-- Heading for the hours column. -->
                    <th>Hours</th>

                    <!-- Heading for the description column. -->
                    <th>Description</th>

                     <th></th> 

                </tr>

            </thead>


            <!-- Contains the actual volunteer entries. -->
            <tbody id="entriesTableBody">

                <!-- JavaScript will add rows here. -->

            </tbody>

        </table>

    </main>

    <div id="editModal" class="edit-modal"> <!-- The edit window container. -->

    <div class="edit-modal-content"> <!-- The actual box that appears inside the window. -->

        <button id="closeEditModal">X</button> <!-- Button to close the edit window. -->

        <h2>Edit Entry</h2> <!-- Title of the edit window. -->

        <label for="editDateInput">Date</label> <!-- Label for the date input. -->
        <input type="date" id="editDateInput"> <!-- Date input for editing. -->

        <label for="editHoursInput">Hours</label> <!-- Label for the hours input. -->
        <input type="number" id="editHoursInput"> <!-- Hours input for editing. -->

        <label for="editDescriptionInput">Description</label> <!-- Label for the description input. -->
        <input type="text" id="editDescriptionInput"> <!-- Description input for editing. -->

        <button id="saveEditButton">Save Changes</button> <!-- Button to save the edit. -->

    </div>

</div>


    <!-- Loads our JavaScript after the HTML has been created. -->
    <script src="script.js"></script>

</body>

</html>
